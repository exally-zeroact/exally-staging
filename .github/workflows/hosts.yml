name: 入口の死活（週1・手動）

# ★通常のCI(ci.yml)には入れない。理由は source-urls.yml と同じ:
#   外の都合(Vercel/GitHubのメンテ・混雑)で赤くなると、うちのコードは壊れていないのに
#   push が止まり、業務が止まる。そして自分のせいでない赤が出ると、人は赤を無視するようになる。
#   だから【別ワークフロー】で週1＋手動。落ちても push は止まらない。
#
# ★誰が見るか（docs/HOSTS.md）
#   落ちたらその週のうちに実装セッションが気づき、★次の報告に必ず
#   「入口 OK N／NG M」の1行を載せる★。落ちていない週も数字を出す
#   （ワークフロー自体が止まっているのが一番危ないため）。

on:
  schedule:
    - cron: '0 0 * * 1'      # 毎週月曜 00:00 UTC = 日本時間 月曜9時
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: ★判定そのものが空振りしていないか（外へ出ない・必ず先に走らせる）
        run: node scripts/check-hosts.mjs --self-test
      - name: ★今の入口が生きているか／古い入口が今の入口へ飛ぶか（うしろを落とさない・飛び先が200）
        run: node scripts/check-hosts.mjs
      # ★2026-08-18 追加。push も CI緑も「客に届いた」ではない。
      #   合図(webhook)が届かず ★ビルドが始まってすらいない★まま、配信が前の版で居座った。
      #   その間 客の画面は 実物の式の81%が #ERROR のままだった。
      - name: ★判定そのものが空振りしていないか（外へ出ない・必ず先に走らせる）
        run: node scripts/check-deployed-version.mjs --self-test
      - name: ★配信されている物が 今のコードと同じ版か（遅れて読む部品の404も見る）
        run: node scripts/check-deployed-version.mjs
