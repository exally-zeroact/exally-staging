name: CI

# Exally（ハブ・台帳・集計・ブック）を回す。
# ★2026-09-05★ 給与(kyuyo/)は Exally から 外した＝給与は Rakunally（司さんの決め）。
#  ・統合前の2リポジトリのCIを【そのまま並べた】もの。実行方式も内容も変えていない。
# ★★2026-09-21 ── 司さん「★お金かからんようにしろや★」★★
#   ＝押し直すと ★前の 回が 止まらず 走り続けて いました★
#   ＝2026-09-20 の 1日で ★15分 ぶんが 丸ごと 無駄★（実測）
#   ⇒★同じ 枝の 古い 回は 止める★
#   ★main は 止めません★（`github.ref` を 群れの 名に 入れる ので
#     main の 回と 枝の 回は 別の 群れ＝main は 最後まで 走ります）
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # ★依存は「使う前」に入れる。CIは毎回まっさらな環境で走るので、
      #   ローカルで緑でも node_modules が無ければ jsdom を使うテストが SKIP になり、
      #   テスト側は「SKIPを緑と呼ばない」作りなので赤になる（その振る舞いが正しい）。
      - name: Install test deps (jsdom / jsqr)
        run: npm install --no-audit --no-fund

      # ── Exally 由来（据置） ──
      - name: ★試験は登録するまで1本も走らない (在る試験と 走る試験を突き合わせる)
        run: node scripts/tests-registered.mjs
      - name: ★その見張り自身の自己確認 (わざと壊して赤になるか)
        run: node scripts/tests-registered.mjs --self-test
      - name: ★AIの頭が 台帳と ずれていないか（prompt/ は 機械が 作る）
        # ★手書きの「使えない関数」22個のうち ★17個が 間違い★だった（2026-09-05 実測）
        #   足してあるのに「使えない」…4個／動かないのに 教えていない…13個
        #   しかも 前置きは「LET・LAMBDA等を 積極的に 提案」＝★動かない式を 勧めていた★
        run: node scripts/make-prompt.mjs --check
      - name: Cache-buster stamp guard (貼り忘れ検知・コードより先に見る)
        run: node scripts/stamp-build.mjs --check
      - name: Stamp tool tests (ハッシュが決定論か=CRLF/LF・OS差でブレないか)
        run: node tests/stamp.test.mjs
      - name: Exally tests (共有データ/集計/台帳→実績値/横断集計/ハブUI/xlsxハーネス)
        run: node tests/run.js

      # ★公開 repo に 実在の 字（司さん・会社・お客さんの 本物）を 戻さない★（2026-10-10）
      #   一覧は repo に 置かない＝secret KINSHI_JI（1行に 1語）。無ければ「未測定」で 赤。
      #   指紋（変数 KINSHI_JI_FINGER）と 違えば 赤＝secret が 縮んだ・壊れた を 止める。
      #   当たっても 字は 出さない（公開の CI ログは 誰でも 読める）。zip（xlsx 等）は ほどいて 中まで 見る。
      - name: 実在の字が戻っていないか（一覧は secret）
        timeout-minutes: 10
        # 本体が 何も 言わずに 終わる（main が 走らない 等）のを 緑に しない＝終わりの 行が 出たかも 見る
        # shell: bash＝-eo pipefail（書かないと -e だけで、tee の 前の 終わり値が 捨てられる）
        shell: bash
        run: |
          npm run kinshi | tee kinshi.out
          grep -q "^✓ 実在の 字 0 件" kinshi.out
        env:
          KINSHI_JI: ${{ secrets.KINSHI_JI }}
          KINSHI_JI_FINGER: ${{ vars.KINSHI_JI_FINGER }}

      - name: 実在の字の見張りの自己確認
        timeout-minutes: 10
        # 全部 通って、しかも 29 組 以上・確かめた 回数 239 以上の 時だけ 緑（組の 中の 歯を 消しても 割れる）
        shell: bash
        run: |
          node tests/kinshi-ji.test.mjs --self-test | tee kinshi-self.out
          sh scripts/ci-yuka.sh kinshi-self.out 29 239

      # ★commit の メールを 公開 repo に 出さない 門（.githooks/pre-push）の 自己確認★（2026-10-11）
      #   門は 手元の push で 走る（git config --local core.hooksPath .githooks）。ここでは 門 自身が 壊れていないかを 見る。
      - name: commit のメールの門の自己確認
        shell: bash
        run: |
          node .githooks/pre-push-author.mjs --self-test | tee mail-self.out
          sh scripts/ci-yuka.sh mail-self.out 7

      # ★押す commit の 中身の 門（.githooks/pre-push-kinshi.mjs）の 自己確認★（2026-10-11）
      #   門 自身は 手元の push で 走る。ここでは 門が 壊れていないか（入れて 消した 字を 赤に する 等）を 見る。
      - name: 押す commit の 中身の 門の自己確認
        shell: bash
        run: |
          node .githooks/pre-push-kinshi.mjs --self-test | tee push-self.out
          sh scripts/ci-yuka.sh push-self.out 16 43

      # ★床の 物差し（scripts/ci-yuka.sh）の 自己確認＝ubuntu の awk で 233・234x 等が 赤に なるか★（2026-10-11）
      - name: 床の物差しの自己確認
        shell: bash
        run: |
          sh scripts/ci-yuka.sh --self-test | tee yuka-self.out
          sh scripts/ci-yuka.sh yuka-self.out 20
      - name: ★重複ガード (同じ物が2箇所に無いか・法定データは例外なし)
        run: node tests/no-duplicate-libs.test.mjs
      - name: ★参照ガード (require/importの先が実在するか・api/が実際に読み込めるか)
        run: node tests/refs-resolve.test.mjs && node tests/refs-resolve.test.mjs --self-test
      - name: ★チャットAPIの基準数値 (実数リテラル・NaNが静かに入らないか)
        run: node tests/api-claude.test.mjs
      - name: ★法定値の直書きガード (率・額が説明文に固定されていないか)
        run: node tests/no-hardcoded-statutory.test.mjs && node tests/no-hardcoded-statutory.test.mjs --self-test
      - name: ★契約v0 (レジストリ / 契約の線=呼ばれているか・面を呼び返していないか)
        run: node tests/op-registry.test.mjs && node tests/op-boundary.test.mjs && node tests/op-boundary.test.mjs --self-test
      - name: ★iPhoneで動かない書き方ガード (type=month / octet-stream / writeFile / Blob散在)
        run: node tests/ios-unsupported.test.mjs && node tests/ios-unsupported.test.mjs --self-test
      - name: ★版対応 (その式が相手のExcelで動くか・Excelに無い23個/版マーカー14個)
        run: node tests/excel-version.test.mjs && node tests/excel-version.test.mjs --self-test
      - name: ★グリッド→xlsx の変換 (落ちる物の警告・実際に書いて読み戻す)
        run: node tests/grid-xlsx.test.mjs
      - name: ★グリッドの日付 (打った日付が日付になる / 売上の数を日付に化けさせない / 書き出しと同じ規則)
        run: node tests/grid-date.test.mjs && node tests/grid-date.test.mjs --self-test
      - name: ★渡した相手の画面で ######## にならないか (日付の列に幅を付けて書き出す)
        run: node tests/grid-colwidth.test.mjs && node tests/grid-colwidth.test.mjs --self-test
      - name: ★設定ファイルに知らない項目/説明文が混ざっていないか (混ぜるとデプロイがビルド前に止まる)
        run: node tests/config-schema.test.mjs && node tests/config-schema.test.mjs --self-test
      - name: ★空振りしているテストが無いか (SKIPを緑と呼んでいないか・逃げ道/除外の一覧)
        run: node tests/hollow-guard.test.mjs --self-test && node tests/hollow-guard.test.mjs
      - name: ★入口の見張りの「判定」が空振りしていないか (外へ出ない部分だけ・実際の死活は hosts.yml 週1)
        run: node scripts/check-hosts.mjs --self-test
      - name: CI coverage guard (CIから黙って外れているテストが無いか=除外は理由と戻す条件つきのみ)
        run: node tests/ci-coverage.test.mjs

      # ── 給与(kyuyo/) 由来（据置） ──

  # ★実在の字の見張りを node 24（ubuntu）でも 回す★（2026-10-11）
  #   node 24.21 の ubuntu で、奇数の 長さの Buffer を toString("utf16le") すると「double free」で process ごと 落ちた
  #   （素の node の 1行で 再現・node 20 は 通る）。見張りは u16le() で 偶数に 揃えて 読む。
  #   本体の 試験は node 20 の まま。ここは 見張りが node 24 でも 落ちない 事だけを 見る（後戻りを 捕まえる）。
  kinshi-node24:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      # ★床の 物差し（scripts/ci-yuka.sh）の 自己確認＝ubuntu の awk で 233・234x 等が 赤に なるか★（2026-10-11）
      - name: 床の物差しの自己確認（node 24 の job）
        shell: bash
        run: |
          sh scripts/ci-yuka.sh --self-test | tee yuka-self.out
          sh scripts/ci-yuka.sh yuka-self.out 20

      - name: 実在の字が戻っていないか（node 24）
        shell: bash
        run: |
          node tests/kinshi-ji.test.mjs | tee kinshi24.out
          grep -q "^✓ 実在の 字 0 件" kinshi24.out
        env:
          KINSHI_JI: ${{ secrets.KINSHI_JI }}
          KINSHI_JI_FINGER: ${{ vars.KINSHI_JI_FINGER }}
      - name: 実在の字の見張りの自己確認（node 24）
        shell: bash
        run: |
          node tests/kinshi-ji.test.mjs --self-test | tee kinshi24-self.out
          sh scripts/ci-yuka.sh kinshi24-self.out 29 239
      # 押す commit の 中身の 門も node 24 で（手元の 機械の node は 24・2026-10-11）
      - name: 押す commit の 中身の 門の自己確認（node 24）
        shell: bash
        run: |
          node .githooks/pre-push-kinshi.mjs --self-test | tee push24-self.out
          sh scripts/ci-yuka.sh push24-self.out 16 43
