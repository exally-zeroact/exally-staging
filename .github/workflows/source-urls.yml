name: 出典URLの死活（週1・手動）

# ★通常のCI(ci.yml)には入れない。理由:
#   ・外部の官公庁サイトに毎回13本叩くと、向こうの都合(メンテ・混雑・レート制限)でCIが赤くなる。
#     それは「うちのコードが壊れた」ではないのに push が止まり、業務が止まる。
#   ・自分のせいでない理由で赤が出ると、人は赤を無視するようになる。それが一番まずい
#     （本物の赤も見なくなる）。
#   だから【別ワークフロー】で週1＋手動。落ちても push は止まらない。
#   見つかった404は実行ログに一覧で出る＝指示役が見て中央 statutory を直す。
#   ★この道具は読むだけ（anon GET）。中央へ書く経路は無い。
#
# ★誰が見るか（docs/SPEC_engine_grid_contract_v0.md §12.2）
#   落ちたらその週のうちに実装セッションが気づき、★次の報告に必ず
#   「出典URL 生きているN／死んでいるM」の1行を載せる★。
#   誰も見ない週1は、無いのと同じ。落ちていない週も数字を出すのは、
#   ワークフロー自体が止まっていることに気づくため。

on:
  schedule:
    - cron: '0 0 * * 1'      # 毎週月曜 00:00 UTC = 日本時間 月曜9時
  workflow_dispatch:          # 手動でも回せる

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: ★中央statutoryの出典URLが全部生きているか（404なら赤・ただしCIは止めない）
        run: node kyuyo/scripts/check-source-urls.mjs

      # ★社保 適用拡大の賃金要件(月88,000円)が法令から消えたか＝e-Gov法令データを実際に叩いて数える。
      #   撤廃は「令和8年10月」予定だが施行日は政令事項＝まだ動く。人が読むページは「予定」としか書かない。
      #   ここが赤(exit 3)＝★切替が要る合図★。★期限 2026-09-15★ までに人が見て判断する。
      #   出典URLと同じ理由で通常CIには入れない（外のサイトの都合で push を止めない）。
      - name: ★賃金要件(88,000円)の撤廃が法令に入ったか（入っていたら赤＝切替の合図）
        run: node kyuyo/scripts/check-wage88k-removal.mjs
